name: 'Android Build'

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set NDK Environment Variable
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          components: rust-src

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Inject cdylib into Cargo.toml
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/crate-type = \[\"staticlib\", \"rlib\"\]/, 'crate-type = [\"staticlib\", \"cdylib\", \"rlib\"]');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Init Android Project & Build APK
        run: |
          pnpm tauri android init
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            pnpm tauri android build --apk --debug --split-per-abi
            pnpm tauri android build --apk --debug
          else
            pnpm tauri android build --apk --split-per-abi
            pnpm tauri android build --apk
          fi

      - name: Sign & Verify Android APKs (Release Only)
        if: inputs.build_type == 'release'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "正在使用 GitHub Secrets 中的正式证书进行签名..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            SIGN_ALIAS="${ANDROID_KEY_ALIAS:-moyu}"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          else
            echo "::warning::未检测到 ANDROID_KEYSTORE_BASE64 Secret！正在生成自签名证书兜底..."
            SIGN_ALIAS="moyu"
            STORE_PASS="moyu_fallback_password"
            KEY_PASS="moyu_fallback_password"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$SIGN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MoYu, OU=Release, O=BA8BAK, C=CN"
          fi

          export STORE_PASS KEY_PASS

          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | while read -r apk_path; do
            echo "正在处理签名: $apk_path"
            if ! "$ZIPALIGN" -c -v 4 "$apk_path" >/dev/null 2>&1; then
              "$ZIPALIGN" -v -p 4 "$apk_path" "${apk_path}.aligned"
              mv "${apk_path}.aligned" "$apk_path"
            fi

            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$SIGN_ALIAS" \
              --ks-pass "env:STORE_PASS" \
              --key-pass "env:KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk_path"

            echo "校验签名有效性:"
            "$APKSIGNER" verify --verbose "$apk_path"
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MoYu-Android-APKs
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
