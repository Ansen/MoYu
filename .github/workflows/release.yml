name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
            target: 'aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install pnpm
        run: npm install -g pnpm

      - name: install frontend dependencies
        run: pnpm install

      - name: Update version from tag
        shell: bash
        run: |
          # Remove 'v' prefix if exists
          RAW_VERSION=${GITHUB_REF_NAME#v}
          export RAW_VERSION
          node -e "
            const fs = require('fs');
            const version = process.env.RAW_VERSION;
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/version = \".*\"/, 'version = \"' + version + '\"'));
          "

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MoYu ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate and Upload SHA256
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while read -r raw_filepath; do
            filepath=$(echo "$raw_filepath" | tr -d '\r')
            if [ -d "$filepath" ]; then
              echo "Skipping directory: $filepath"
              continue
            fi
            if [ ! -f "$filepath" ]; then
              echo "File not found: $filepath"
              continue
            fi
            filename=$(basename "$filepath")
            sha256sum "$filepath" | awk '{print $1 "  " "'"$filename"'"}' > "$filename.sha256"
            gh release upload ${{ github.ref_name }} "$filename.sha256" --clobber
          done

  publish-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          mkdir -p updater
          cd updater
          
          # Download all sig files from this release
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern "*.sig"
          
          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Update to $VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {}
          }
          EOF
          
          node -e "
            const fs = require('fs');
            const repo = '${{ github.repository }}';
            const version = '${{ github.ref_name }}';
            const downloadBase = \`https://github.com/\${repo}/releases/download/\${version}\`;
            
            let latest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            
            const files = fs.readdirSync('.');
            files.filter(f => f.endsWith('.sig')).forEach(sigFile => {
              const signature = fs.readFileSync(sigFile, 'utf8').trim();
              const assetName = sigFile.replace('.sig', '');
              const lowerName = assetName.toLowerCase();
              
              if (!lowerName.endsWith('.zip') && !lowerName.endsWith('.tar.gz')) {
                return;
              }
              
              const url = \`\${downloadBase}/\${assetName}\`;
              let platform = '';
              
              if (lowerName.includes('windows') || lowerName.includes('setup') || lowerName.includes('msi')) {
                if (lowerName.includes('arm64') || lowerName.includes('aarch64')) platform = 'windows-aarch64';
                else platform = 'windows-x86_64';
              } else if (lowerName.includes('darwin') || lowerName.includes('mac') || lowerName.includes('.app.tar.gz')) {
                if (lowerName.includes('aarch64') || lowerName.includes('arm64')) platform = 'darwin-aarch64';
                else platform = 'darwin-x86_64';
              } else if (lowerName.includes('linux') || lowerName.includes('appimage')) {
                if (lowerName.includes('aarch64') || lowerName.includes('arm64')) platform = 'linux-aarch64';
                else platform = 'linux-x86_64';
              }
              
              if (platform) {
                latest.platforms[platform] = { signature, url };
              }
            });
            
            fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2));
            console.log('Generated latest.json:');
            console.log(JSON.stringify(latest, null, 2));
          "
          
          gh release upload ${{ github.ref_name }} latest.json --repo ${{ github.repository }} --clobber
