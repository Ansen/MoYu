name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - name: install frontend dependencies
        run: pnpm install

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Update version from tag
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME#v}
          export RAW_VERSION
          node -e "
            const fs = require('fs');
            const version = process.env.RAW_VERSION;
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/version = \".*\"/, 'version = \"' + version + '\"'));
          "

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MoYu ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate and Upload SHA256
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while read -r raw_filepath; do
            filepath=$(echo "$raw_filepath" | tr -d '\r')
            if [ -d "$filepath" ] || [ ! -f "$filepath" ]; then
              continue
            fi
            filename=$(basename "$filepath")
            sha256sum "$filepath" | awk '{print $1 "  " "'"$filename"'"}' > "$filename.sha256"
            gh release upload ${{ github.ref_name }} "$filename.sha256" --clobber
          done

  publish-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p updater
          cd updater
          
          # Download all signature files
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.sig"
          
          node -e "
            const fs = require('fs');
            const repo = process.env.GITHUB_REPOSITORY;
            const version = process.env.GITHUB_REF_NAME;
            const downloadBase = \`https://github.com/\${repo}/releases/download/\${version}\`;

            let latest = {
              version: version.replace(/^v/, ''),
              notes: \`Release \${version}\`,
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            const files = fs.readdirSync('.');
            files.filter(f => f.endsWith('.sig')).forEach(sigFile => {
              const signature = fs.readFileSync(sigFile, 'utf8').trim();
              const assetName = sigFile.slice(0, -4);
              const lower = assetName.toLowerCase();
              const url = \`\${downloadBase}/\${assetName}\`;

              if (lower.includes('universal') || (lower.includes('darwin') && lower.endsWith('.tar.gz'))) {
                latest.platforms['darwin-x86_64'] = { signature, url };
                latest.platforms['darwin-aarch64'] = { signature, url };
              } else if (lower.includes('x64') && (lower.includes('windows') || lower.endsWith('.zip') || lower.endsWith('.exe'))) {
                latest.platforms['windows-x86_64'] = { signature, url };
              } else if (lower.includes('amd64') || lower.includes('x86_64')) {
                latest.platforms['linux-x86_64'] = { signature, url };
              }
            });

            fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2));
            console.log('Generated latest.json:\n', JSON.stringify(latest, null, 2));
          "

          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
