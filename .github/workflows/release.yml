name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          BODY=$(git log -1 --pretty=format:"%b")
          CLEAN_BODY=$(echo "$BODY" | tr -d '[:space:]')

          if [ -n "$CLEAN_BODY" ]; then
            NOTES="$BODY"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"- %s" --no-merges)
            else
              NOTES=$(git log -1 --pretty=format:"%s")
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi

          echo "notes<<__MOYU_CHANGELOG_EOF__" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "__MOYU_CHANGELOG_EOF__" >> $GITHUB_OUTPUT

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        run: npm install -g pnpm

      - name: install frontend dependencies
        run: pnpm install

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Update version from tag
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME#v}
          export RAW_VERSION
          node -e "
            const fs = require('fs');
            const version = process.env.RAW_VERSION;
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/version = \".*\"/, 'version = \"' + version + '\"'));
          "

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MoYu ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Generate and Upload SHA256
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while read -r raw_filepath; do
            filepath=$(echo "$raw_filepath" | tr -d '\r')
            if [ -d "$filepath" ] || [ ! -f "$filepath" ]; then
              continue
            fi
            filename=$(basename "$filepath")
            sha256sum "$filepath" | awk '{print $1 "  " "'"$filename"'"}' > "$filename.sha256"
            gh release upload ${{ github.ref_name }} "$filename.sha256" --clobber
          done

  publish-android:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set NDK Environment Variable
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          components: rust-src

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Update version and inject cdylib
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF_NAME#v}
          export RAW_VERSION
          node -e "
            const fs = require('fs');
            const version = process.env.RAW_VERSION;
            const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/version = \".*\"/, 'version = \"' + version + '\"');
            cargo = cargo.replace(/crate-type = \[\"staticlib\", \"rlib\"\]/, 'crate-type = [\"staticlib\", \"cdylib\", \"rlib\"]');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Init Android Project & Build APK
        run: |
          pnpm tauri android init
          # 1. 构建各 CPU 架构的专用分包（体积小，适合手机）
          pnpm tauri android build --apk --split-per-abi
          # 2. 构建包含所有架构的 Universal 通用包（兼容所有模拟器及特殊设备）
          pnpm tauri android build --apk

      - name: Sign & Verify Android APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "正在使用 GitHub Secrets 中的正式证书进行签名..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            SIGN_ALIAS="${ANDROID_KEY_ALIAS:-moyu}"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          else
            echo "::warning::未检测到 ANDROID_KEYSTORE_BASE64 Secret！正在生成自签名证书兜底，确保 APK 具备合法签名可立即安装..."
            SIGN_ALIAS="moyu"
            STORE_PASS="moyu_fallback_password"
            KEY_PASS="moyu_fallback_password"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$SIGN_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MoYu, OU=Release, O=BA8BAK, C=CN"
          fi

          export STORE_PASS KEY_PASS

          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | while read -r apk_path; do
            echo "正在处理签名: $apk_path"
            
            # 对齐校验
            if ! "$ZIPALIGN" -c -v 4 "$apk_path" >/dev/null 2>&1; then
              echo "正在对齐: $apk_path"
              "$ZIPALIGN" -v -p 4 "$apk_path" "${apk_path}.aligned"
              mv "${apk_path}.aligned" "$apk_path"
            fi

            # 注入 v1, v2, v3 规范数字签名
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$SIGN_ALIAS" \
              --ks-pass "env:STORE_PASS" \
              --key-pass "env:KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk_path"

            # 验证签名，确保符合 Android 规范
            echo "校验签名有效性:"
            "$APKSIGNER" verify --verbose "$apk_path"
          done

      - name: Upload APKs to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          RAW_VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release-apks
          
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release*.apk" | while read -r apk_path; do
            filename=$(basename "$apk_path")
            clean_name=$(echo "$filename" | sed -E 's/^app-//' | sed -E 's/-release(-unsigned)?//')
            new_name="MoYu_${RAW_VERSION}_android_${clean_name}"
            cp "$apk_path" "release-apks/${new_name}"
            
            # 如果是 arm64，同时提供 arm64-v8a 别名以便官网下载链接精准对应
            if [ "$clean_name" = "arm64.apk" ]; then
              cp "$apk_path" "release-apks/MoYu_${RAW_VERSION}_android_arm64-v8a.apk"
            elif [ "$clean_name" = "arm.apk" ]; then
              cp "$apk_path" "release-apks/MoYu_${RAW_VERSION}_android_armeabi-v7a.apk"
            fi
          done

          cd release-apks
          for file in *.apk; do
            [ -f "$file" ] || continue
            sha256sum "$file" > "${file}.sha256"
          done
          cd ..

          if [ -d release-apks ] && [ "$(ls -A release-apks)" ]; then
            for file in release-apks/*; do
              gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            done
          fi

  publish-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p updater
          cd updater
          
          # Extract commit notes
          BODY=$(git log -1 --pretty=format:"%b")
          CLEAN_BODY=$(echo "$BODY" | tr -d '[:space:]')
          if [ -n "$CLEAN_BODY" ]; then
            NOTES="$BODY"
          else
            NOTES=$(git log -1 --pretty=format:"%s")
          fi
          export NOTES

          # Explicitly update GitHub Release description
          gh release edit "$GITHUB_REF_NAME" --notes "$NOTES" --repo "$GITHUB_REPOSITORY" || true

          # Download all signature files (or continue if none found)
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" || true
          
          node -e "
            const fs = require('fs');
            const repo = process.env.GITHUB_REPOSITORY;
            const version = process.env.GITHUB_REF_NAME;
            const githubBase = \`https://github.com/\${repo}/releases/download/\${version}\`;
            const cdnBase = \`https://moyu-dl.wjzhx.com/\${repo}/releases/download/\${version}\`;

            function generateLatestJson(baseUrl) {
              let latest = {
                version: version.replace(/^v/, ''),
                notes: process.env.NOTES || \`Release \${version}\`,
                pub_date: new Date().toISOString(),
                platforms: {}
              };

              const files = fs.readdirSync('.');
              const sigFiles = files.filter(f => f.endsWith('.sig'));
              if (sigFiles.length === 0) {
                console.warn('WARNING: No .sig files found! Check if TAURI_PRIVATE_KEY is set in GitHub Repository Secrets.');
              }

              sigFiles.forEach(sigFile => {
                const signature = fs.readFileSync(sigFile, 'utf8').trim();
                const assetName = sigFile.slice(0, -4);
                const lower = assetName.toLowerCase();
                const url = \`\${baseUrl}/\${assetName}\`;

                if (lower.includes('aarch64') || lower.includes('arm64')) {
                  latest.platforms['darwin-aarch64'] = { signature, url };
                } else if (lower.includes('x86_64') || lower.includes('x64')) {
                  if (lower.includes('darwin') || lower.includes('mac') || lower.endsWith('.app.tar.gz')) {
                    latest.platforms['darwin-x86_64'] = { signature, url };
                  } else if (lower.includes('windows') || lower.includes('setup') || lower.endsWith('.exe') || lower.endsWith('.zip')) {
                    latest.platforms['windows-x86_64'] = { signature, url };
                  }
                } else if (lower.includes('universal')) {
                  latest.platforms['darwin-x86_64'] = { signature, url };
                  latest.platforms['darwin-aarch64'] = { signature, url };
                } else if (lower.includes('windows') || lower.endsWith('.exe') || lower.endsWith('.zip')) {
                  latest.platforms['windows-x86_64'] = { signature, url };
                } else if (lower.includes('amd64') || lower.includes('linux') || lower.endsWith('.appimage')) {
                  latest.platforms['linux-x86_64'] = { signature, url };
                }
              });

              return latest;
            }

            const latestGithub = generateLatestJson(githubBase);
            const latestCdn = generateLatestJson(cdnBase);

            fs.writeFileSync('latest.json', JSON.stringify(latestGithub, null, 2));
            fs.writeFileSync('latest-cdn.json', JSON.stringify(latestCdn, null, 2));

            console.log('Generated latest.json (GitHub Official):\n', JSON.stringify(latestGithub, null, 2));
            console.log('Generated latest-cdn.json (CDN Fast Channel):\n', JSON.stringify(latestCdn, null, 2));
          "

          gh release upload "$GITHUB_REF_NAME" latest.json latest-cdn.json --repo "$GITHUB_REPOSITORY" --clobber
